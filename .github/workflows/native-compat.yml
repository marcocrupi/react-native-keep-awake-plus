name: Native compatibility

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: whole New Architecture support window plus the RN release monitor.
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      selection:
        description: 'stable: latest RN lanes; support: stable plus older New Architecture boundaries; window: boundaries only; anchor: example RN regression run'
        type: choice
        options: [stable, support, window, anchor]
        default: stable

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.selection || (github.event_name == 'schedule' && 'support') || 'stable' }}
  cancel-in-progress: true

jobs:
  release-monitor:
    name: React Native release monitor
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: node scripts/native-ci/release-monitor.cjs

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.matrix.outputs.lanes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: node --test scripts/native-ci/contracts.test.cjs
      - id: matrix
        env:
          SELECTION: ${{ inputs.selection || (github.event_name == 'schedule' && 'support') || 'stable' }}
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const p = require('./scripts/native-ci/matrix.json');
          const {laneEntries} = require('./scripts/native-ci/lib.cjs');
          console.log('lanes='+JSON.stringify(laneEntries(p, process.env.SELECTION)));
          NODE

  android:
    name: Android RN ${{ matrix.rn }}
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.contracts.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm install --global npm@11.11.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Record runner and provision the template's exact SDKs
        env:
          RN_VERSION: ${{ matrix.rn }}
        run: |
          uname -a
          java -version
          node --version
          npm --version
          df -h
          command -v sdkmanager
          sdkmanager --version
          node -e 'const sdk=require("./scripts/native-ci/matrix.json").lanes[process.env.RN_VERSION].android;console.log(sdk.join(" "));const r=require("node:child_process").spawnSync("sdkmanager",["--install",...sdk],{stdio:"inherit"});process.exit(r.status??1)'
      - name: Consumer tarball, Codegen, lifecycle, Debug and Release arm64
        env:
          RN_VERSION: ${{ matrix.rn }}
        run: node scripts/native-ci/lane.cjs android "$RN_VERSION" "$RUNNER_TEMP/native-android-$RN_VERSION"
      - name: Native evidence (also on failure)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-android-${{ matrix.rn }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native-android-${{ matrix.rn }}/result.json
            ${{ runner.temp }}/native-android-${{ matrix.rn }}/logs/
            ${{ runner.temp }}/native-android-${{ matrix.rn }}/test-results/
            ${{ runner.temp }}/native-android-${{ matrix.rn }}/NativeMatrix/package-lock.json
            ${{ runner.temp }}/native-android-${{ matrix.rn }}/*.tgz

  ios:
    name: iOS RN ${{ matrix.rn }}
    needs: contracts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.contracts.outputs.lanes) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm install --global npm@11.11.0
      - name: Verify available toolchain and pin CocoaPods
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -showsdks
          sw_vers
          uname -m
          df -h
          gem install cocoapods --version 1.16.2 --no-document --user-install
          ruby -r rubygems -e 'puts Gem.user_dir + "/bin"' >> "$GITHUB_PATH"
      - name: Clean Pods, Codegen and arm64 simulator compilation
        env:
          RN_VERSION: ${{ matrix.rn }}
        run: node scripts/native-ci/lane.cjs ios "$RN_VERSION" "$RUNNER_TEMP/native-ios-$RN_VERSION"
      - name: Native evidence (also on failure)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-${{ matrix.rn }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native-ios-${{ matrix.rn }}/result.json
            ${{ runner.temp }}/native-ios-${{ matrix.rn }}/logs/
            ${{ runner.temp }}/native-ios-${{ matrix.rn }}/NativeMatrix/package-lock.json
            ${{ runner.temp }}/native-ios-${{ matrix.rn }}/Podfile.lock
            ${{ runner.temp }}/native-ios-${{ matrix.rn }}/*.tgz

  required-native:
    name: Required native compatibility
    if: ${{ always() }}
    needs: [contracts, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CONTRACTS: ${{ needs.contracts.result }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
        run: test "$CONTRACTS" = success && test "$ANDROID" = success && test "$IOS" = success
