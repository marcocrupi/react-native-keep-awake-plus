name: Native compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      selection:
        description: 'stable: required targets; anchor: separate RN 0.85.3 regression run'
        type: choice
        options: [stable, anchor]
        default: stable

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.selection || 'stable' }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.matrix.outputs.android }}
      ios: ${{ steps.matrix.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: node --test scripts/native-ci/contracts.test.cjs
      - id: matrix
        env:
          SELECTION: ${{ inputs.selection || 'stable' }}
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const p = require('./scripts/native-ci/matrix.json');
          const {selectMatrix} = require('./scripts/native-ci/lib.cjs');
          const android = selectMatrix(p, process.env.SELECTION);
          const ios = process.env.SELECTION === 'anchor' ? android : android.filter(v => p.iosStable.includes(v));
          if (!ios.length) throw new Error('empty iOS matrix');
          console.log('android='+JSON.stringify(android));
          console.log('ios='+JSON.stringify(ios));
          NODE

  android:
    name: Android RN ${{ matrix.rn }}
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        rn: ${{ fromJSON(needs.contracts.outputs.android) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm install --global npm@11.11.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Record runner and provision exact SDKs
        run: |
          uname -a
          java -version
          node --version
          npm --version
          df -h
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --install 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - name: Consumer tarball, Codegen, lifecycle, Debug and Release arm64
        env:
          RN_VERSION: ${{ matrix.rn }}
        run: node scripts/native-ci/lane.cjs android "$RN_VERSION" "$RUNNER_TEMP/native-android-$RN_VERSION"
      - name: Native evidence (also on failure)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-android-${{ matrix.rn }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native-android-${{ matrix.rn }}/result.json
            ${{ runner.temp }}/native-android-${{ matrix.rn }}/logs/
            ${{ runner.temp }}/native-android-${{ matrix.rn }}/test-results/
            ${{ runner.temp }}/native-android-${{ matrix.rn }}/NativeMatrix/package-lock.json
            ${{ runner.temp }}/native-android-${{ matrix.rn }}/*.tgz

  ios:
    name: iOS RN ${{ matrix.rn }}
    needs: contracts
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rn: ${{ fromJSON(needs.contracts.outputs.ios) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm install --global npm@11.11.0
      - name: Verify available toolchain and pin CocoaPods
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -showsdks
          sw_vers
          uname -m
          df -h
          gem install cocoapods --version 1.16.2 --no-document --user-install
          ruby -r rubygems -e 'puts Gem.user_dir + "/bin"' >> "$GITHUB_PATH"
      - name: Clean Pods, Codegen and arm64 simulator compilation
        env:
          RN_VERSION: ${{ matrix.rn }}
        run: node scripts/native-ci/lane.cjs ios "$RN_VERSION" "$RUNNER_TEMP/native-ios-$RN_VERSION"
      - name: Native evidence (also on failure)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-${{ matrix.rn }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native-ios-${{ matrix.rn }}/result.json
            ${{ runner.temp }}/native-ios-${{ matrix.rn }}/logs/
            ${{ runner.temp }}/native-ios-${{ matrix.rn }}/NativeMatrix/package-lock.json
            ${{ runner.temp }}/native-ios-${{ matrix.rn }}/Podfile.lock
            ${{ runner.temp }}/native-ios-${{ matrix.rn }}/*.tgz

  required-native:
    name: Required native compatibility
    if: ${{ always() }}
    needs: [contracts, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CONTRACTS: ${{ needs.contracts.result }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
        run: test "$CONTRACTS" = success && test "$ANDROID" = success && test "$IOS" = success
