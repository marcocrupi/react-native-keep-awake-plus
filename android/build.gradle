// Android and React Native plugins are supplied by the consumer application.
// Require its SDK policy instead of silently compiling against an obsolete SDK.
def consumerSdk = { name ->
    def value = rootProject.ext.has(name) ? rootProject.ext.get(name) : null
    if (value == null) {
        throw new GradleException("react-native-keep-awake-plus requires rootProject.ext.${name} from the consumer application")
    }
    value
}

def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

apply plugin: 'com.android.library'
if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

android {
    namespace "com.sayem.keepawake"

    compileSdk = consumerSdk('compileSdkVersion')

    defaultConfig {
        minSdk = consumerSdk('minSdkVersion')
        // targetSdk is the application's policy; libraries do not set it.
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    }

    // Required by KCKeepAwakePackage on AGP versions where generation is opt-in.
    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main {
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ['src/newarch']
            } else {
                java.srcDirs += ['src/oldarch']
            }
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        // Deadlock regressions use a watchdog; isolate their JVM from the other test classes.
        unitTests.all {
            forkEvery = 1
            maxParallelForks = 1
        }
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    compileOnly "com.facebook.react:react-android"
    testImplementation "com.facebook.react:react-android"
    testImplementation "junit:junit:4.13.2"
    // Keep the SDK 34 lifecycle regression harness stable across consumer toolchains.
    testImplementation "org.robolectric:robolectric:4.11.1"
    testImplementation "org.mockito:mockito-core:4.11.0"
}
